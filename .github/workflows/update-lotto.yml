name: Lotto data auto update

on:
  schedule:
    # 한국시간 매주 토요일 22:10 (UTC 13:10) - 추첨 후 결과 반영 여유 1시간
    - cron: "10 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Update weekly lotto data
        run: python update_lotto.py

      - name: Commit if changed
        run: |
          git add lotto_data.json rarity_model.json

          if git diff --cached --quiet; then
            echo "No data/model changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Auto update lotto data and rarity model"
          git push
